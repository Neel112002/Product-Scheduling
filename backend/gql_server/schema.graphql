
# schema.graphql

scalar DateTime

type User {
  id: Int!                 # 🔥 NEW (frontend-friendly)
  user_id: Int!
  username: String!
  user_email: String!
  display_name: String
  role: String
  isActive: Boolean!
  company: Company
  primaryLocation: Location
}

type Company {
  id: Int!
  name: String!
  email: String
  address: String
  locations: [Location!]!
}

type Location {
  id: Int!
  name: String!
  address: String
  company: Company
}

type Shift {
  id: Int!
  location: Location!
  startTime: DateTime!
  endTime: DateTime!
  role: String
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

type InviteResult {
  userId: Int!
  inviteId: Int!
  email: String!
}

type Query {
  me: User
  myLocations: [Location!]!
  shiftsByLocation(locationId: Int!): [Shift!]!

  # 🔥 TEAM QUERY
  teamMembers(locationId: Int!): [User!]!
}

type Mutation {
  login(email: String!, password: String!): AuthPayload!
  sendOnboardingInvite(email: String!, locationId: Int!, position: String): InviteResult!
  createShift(locationId: Int!, startTime: DateTime!, endTime: DateTime!, role: String): Shift!
  updateProfile(displayName: String, phone: String): User!
}