
# schema.graphql

scalar DateTime

type User {
  user_id: Int!
  username: String!
  user_email: String!
  display_name: String
  role: String
  company: Company
  primaryLocation: Location
}

type Company {
  id: Int!
  name: String!
  email: String
  address: String
  locations: [Location!]!
}

type Location {
  id: Int!
  name: String!
  address: String
  company: Company
}

type Shift {
  id: Int!
  location: Location!
  startTime: DateTime!
  endTime: DateTime!
  role: String
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

type InviteResult {
  userId: Int!
  inviteId: Int!
  email: String!
}

type Query {
  # Return logged-in user, or null if not authenticated
  me: User

  # All locations the user has active employment at
  myLocations: [Location!]!

  # Shifts for current user at a given location
  shiftsByLocation(locationId: Int!): [Shift!]!
}

type Mutation {
  # Login to get JWT tokens
  login(email: String!, password: String!): AuthPayload!

  # Owner/manager sends onboarding invite
  sendOnboardingInvite(email: String!, locationId: Int!, position: String): InviteResult!

  # Placeholder for shift creation
  createShift(locationId: Int!, startTime: DateTime!, endTime: DateTime!, role: String): Shift!

  # Employee profile update
  updateProfile(displayName: String, phone: String): User!
}
